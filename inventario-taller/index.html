<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/Logo-principal.png">
<title>Inventario de patio — Taller metalmecánica</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="wrap">
      <div class="header-brand">
  <img src="/Logo-principal.png" alt="Torca Machinery" class="header-logo">
  <div>
    <h1>Inventario TORCA</h1>
    <p class="sub">Barras con huecos, barras macizas, planchas, otros... </p>
  </div>
      </div>
  <div id="conn-status" class="status">Conectando...</div>

  <div class="tabs" id="tabs-container">
  <div class="tab active" data-tab="buscar">Buscar</div>
  <div class="tab" data-tab="agregar">Agregar</div>
  <div class="tab" data-tab="inventario">Inventario</div>
  <div class="tab-indicator" id="tab-indicator"></div>
</div>

  <div class="panel active" id="panel-buscar">
   <div class="field">
  <label>Tipo de material</label>
  <select id="s-tipo">
    <option>Barra maciza</option>
    <option>Barra con hueco</option>
    <option>Plancha</option>
    <option>Otros</option>
  </select>
</div>
    <div class="card">
      <p class="hint">Ingresa lo que necesitas. Deja en blanco lo que no aplique.</p>
      <div class="row3">
        <div class="field" data-campo="id_mm"><label>ID (mm)</label><input type="number" id="s-id" step="0.1" value="0"></div>
        <div class="field" data-campo="od_mm"><label>OD (mm)</label><input type="number" id="s-od" step="0.1"></div>
        <div class="field" data-campo="espesor_mm"><label>Espesor (mm)</label><input type="number" id="s-esp" step="0.1"></div>
      </div>
      <div class="row2">
        <div class="field" data-campo="ancho_cm"><label>Ancho (cm)</label><input type="number" id="s-ancho" step="0.1"></div>
        <div class="field" data-campo="largo_cm"><label>Largo (cm)</label><input type="number" id="s-largo" step="0.1"></div>
      </div>
      <button onclick="buscar()" style="width:100%;margin-top:4px;">Buscar material</button>
    </div>
    <div id="resultados"></div>
  </div>

  <div class="panel" id="panel-agregar">
    <div class="card">
      <div class="field">
  <label>Foto</label>
  <div class="photo-block">
      <div class="photo-preview-lg" id="photo-preview-box">
        <img id="photo-preview" src="" style="display:none;">
        <span id="photo-placeholder">📦</span>
      </div>
      <input type="hidden" id="a-foto-url-actual" value="">
    <div class="photo-buttons">
      <label for="foto-camara" class="photo-btn">📷 Tomar foto</label>
      <input type="file" accept="image/*" capture="environment" id="foto-camara" onchange="onFotoChange(event)" class="photo-input-hidden">
      <label for="foto-input" class="photo-btn secondary">🖼️ Galería</label>
      <input type="file" accept="image/*" id="foto-input" onchange="onFotoChange(event)" class="photo-input-hidden">
    </div>
  </div>
</div>
      <div class="field"><label>Código (se genera solo, puedes editarlo)</label><input type="text" id="a-codigo"></div>
<div class="field">
  <label>Tipo de material</label>
  <select id="a-tipo">
    <option>Barra maciza</option>
    <option>Barra con hueco</option>
    <option>Plancha</option>
    <option>Otros</option>
  </select>
</div>
      <div class="field"><label>Material / aleación (ej. SAE 1045, acero inoxidable)</label><input type="text" id="a-material" placeholder="Opcional"></div>
      <div class="row3">
        <div class="field" data-campo="id_mm"><label>ID (mm)</label><input type="number" id="a-id" step="0.1" placeholder="0 si es sólido"></div>
        <div class="field" data-campo="od_mm"><label>OD (mm)</label><input type="number" id="a-od" step="0.1"></div>
        <div class="field" data-campo="espesor_mm"><label>Espesor (mm)</label><input type="number" id="a-esp" step="0.1" placeholder="Opcional"></div>
      </div>
      <div class="row2">
        <div class="field" data-campo="ancho_cm"><label>Ancho (cm)</label><input type="number" id="a-ancho" step="0.1" placeholder="Para platinas"></div>
        <div class="field" data-campo="largo_cm"><label>Largo (cm)</label><input type="number" id="a-largo" step="0.1"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Ubicación en patio</label><input type="text" id="a-ubic" placeholder="Ej. Estante 3, fila B"></div>
        <div class="field"><label>Cantidad / piezas</label><input type="number" id="a-cant" step="1" placeholder="Opcional"></div>
      </div>
      <div class="field"><label>Observaciones</label><textarea id="a-notas" rows="2" placeholder="Opcional"></textarea></div>
      <button id="btn-guardar" onclick="agregarMaterial()" style="width:100%;">Guardar material</button>
      <button id="btn-cancelar-edicion" class="secondary" onclick="cancelarEdicion()" style="width:100%;margin-top:8px;display:none;">Cancelar edición</button>
      <p class="save-msg" id="save-msg">Guardado correctamente.</p>
      <p class="err-msg" id="err-msg"></p>
    </div>
  </div>

  <div class="panel" id="panel-inventario">
    <div class="card" style="margin-bottom:.8rem;">
      <input type="text" id="filtro-inv" placeholder="Filtrar por tipo, material o ubicación..." oninput="renderInventario()">
    </div>
    <div id="lista-inventario"></div>
  </div>
    <div id="modal-confirm" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <p class="modal-text">¿Eliminar este material del inventario?</p>
    <div class="modal-buttons">
      <button class="secondary" onclick="cerrarModalConfirm(false)">Cancelar</button>
      <button class="modal-danger" onclick="cerrarModalConfirm(true)">Eliminar</button>
    </div>
  </div>
  </div>
  <div class="footer-brand">Torca 2004 C.A. ©</div>
</div>
<div id="modal-imagen" class="modal-overlay" style="display:none;" onclick="cerrarImagenAmpliada()">
  <div class="modal-detalle" onclick="event.stopPropagation()">
    <img id="modal-imagen-img" src="" style="max-width:100%;max-height:60vh;border-radius:8px;border:1px solid var(--border);display:block;">
    <p id="modal-detalle-titulo" class="modal-detalle-titulo"></p>
    <p id="modal-detalle-ubic" class="modal-detalle-ubic"></p>
    <p id="modal-detalle-obs" class="modal-detalle-obs"></p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
